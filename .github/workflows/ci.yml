name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Standards sync drift check
        run: python3 scripts/sync-standards.py --check
      - name: Suite structural lint
        run: python3 scripts/validate_skills.py
      - name: Compile all scripts
        run: python3 -m py_compile scripts/*.py skills/*/scripts/*.py
      - name: Skill fixture smoke tests
        run: python3 scripts/smoke_skills.py
