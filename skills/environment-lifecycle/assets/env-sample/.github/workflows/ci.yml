name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/seed.sh test
      - run: make test

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        environment: [preview, staging, production]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh ${{ matrix.environment }}
